name: Andy Core Stable Legacy Upgrade Compatibility (Disposable)
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synthetic-legacy-upgrade:
    name: "Legacy upgrade disposable"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - legacy_version: '1.5.2'
            source_sha: '073ef9d34bbd5bfda1db7ca52caf358f7e6ade87'
          - legacy_version: '1.9.0'
            source_sha: '2da7fe87b7daa348c4ba8b51c73052f9d9422ab7'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: legacy_validation
          MYSQL_USER: legacy
          MYSQL_PASSWORD: disposable-only
          MYSQL_ROOT_PASSWORD: disposable-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-only-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_PATH: '${{ runner.temp }}/wordpress'
      YBY_DISPOSABLE_MYSQL_ONLY: 'true'
      YBY_LEGACY_VERSION: ${{ matrix.legacy_version }}
      LEGACY_SOURCE_SHA: ${{ matrix.source_sha }}
    steps:
      - name: Checkout repository with exact historic source commits
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium
          coverage: none

      - name: Install disposable WordPress 7.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp
          wp core download --path="$WP_PATH" --version=7.1.3
          wp config create --path="$WP_PATH" --dbname=legacy_validation --dbuser=legacy --dbpass=disposable-only --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://disposable.test --title=Validation --admin_user=admin --admin_password=disposable-only --admin_email=nonexistent@disposable.test --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1.3

      - name: Install pinned legacy plugin and synthetic database fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$LEGACY_SOURCE_SHA^{commit}")" = "$LEGACY_SOURCE_SHA"
          mkdir -p "$WP_PATH/wp-content/plugins/yby-core"
          git archive "$LEGACY_SOURCE_SHA" | tar -x -C "$WP_PATH/wp-content/plugins/yby-core"
          wp plugin activate yby-core --path="$WP_PATH"
          YBY_LEGACY_PHASE=seed wp eval-file "$GITHUB_WORKSPACE/tests/stable-legacy-upgrade-compatibility.php" --path="$WP_PATH"

      - name: Upgrade code only in disposable WP and verify schema/lead safety
        shell: bash
        run: |
          set -euo pipefail
          wp plugin deactivate yby-core --path="$WP_PATH"
          rm -rf "$WP_PATH/wp-content/plugins/yby-core"
          mkdir -p "$WP_PATH/wp-content/plugins/yby-core"
          git archive HEAD | tar -x -C "$WP_PATH/wp-content/plugins/yby-core"
          wp plugin activate yby-core --path="$WP_PATH"
          YBY_LEGACY_PHASE=verify wp eval-file "$GITHUB_WORKSPACE/tests/stable-legacy-upgrade-compatibility.php" --path="$WP_PATH"

      - name: Scope and irreversible production protections
        run: |
          echo 'Evidence: synthetic WordPress/MySQL migration only.'
          echo 'Production backups, real data, signed Update Now and Web PHP remain separate gates.'
          echo 'No production website credentials, orders, emails or real data are accessed.'
