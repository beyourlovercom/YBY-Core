name: Release Package Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20.19.1'

      - name: Release metadata assertions
        shell: bash
        run: |
          set -euo pipefail
          php tests/release-metadata-harness.php
          git diff --check
          for file in tests/*-harness.js; do node --check "$file"; done

      - name: Build release candidate package
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BUILD_CONTEXT=RELEASE_CANDIDATE bash scripts/build-v1.5.3-release.sh
          test -s releases/v1.5.3/andy-core-v1.5.3.zip
          test -s releases/v1.5.3/SHA256.txt
          test -s releases/v1.5.3/BUILD_INFO.md
          for doc in RELEASE_NOTES_v1.5.3.md UPGRADE_GUIDE_v1.5.3.md ROLLBACK_GUIDE_v1.5.3.md; do
            test -s "$doc"
            cp "$doc" releases/v1.5.3/
          done
          unzip -Z1 releases/v1.5.3/andy-core-v1.5.3.zip | awk -F/ 'NF && $1 != "yby-core" { exit 1 }'
          unzip -Z1 releases/v1.5.3/andy-core-v1.5.3.zip | grep -Fx 'yby-core/yby-core.php'
          ! unzip -Z1 releases/v1.5.3/andy-core-v1.5.3.zip | grep -E '(^|/)(\.git|\.github|tests|docs|releases)(/|$)'
          unzip -p releases/v1.5.3/andy-core-v1.5.3.zip yby-core/yby-core.php | grep -F 'Version:           1.5.3'
          unzip -p releases/v1.5.3/andy-core-v1.5.3.zip yby-core/yby-core.php | grep -F "define( 'YBY_CORE_VERSION', '1.5.3' );"
          unzip -p releases/v1.5.3/andy-core-v1.5.3.zip yby-core/yby-core.php | grep -F "define( 'YBY_DATABASE_VERSION', '1.4.0' );"
          grep -F 'Build Context: RELEASE_CANDIDATE' releases/v1.5.3/BUILD_INFO.md
          grep -F 'PHP Lint: PASS' releases/v1.5.3/BUILD_INFO.md
          grep -F 'git diff --check: PASS' releases/v1.5.3/BUILD_INFO.md

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: andy-core-v1.5.3-release-candidate
          path: releases/v1.5.3
          if-no-files-found: error
