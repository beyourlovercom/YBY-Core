name: Release Package Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20.19.1'

      - name: Release and updater assertions
        shell: bash
        run: |
          set -euo pipefail
          php tests/release-metadata-harness.php
          php tests/secure-updater-harness.php
          php tests/addon-registry-harness.php
          git diff --check
          for file in tests/*-harness.js; do node --check "$file"; done

      - name: Validate exact six-file Andy Core V2 Dev-only Hostinger candidate
        shell: bash
        run: |
          set -euo pipefail
          staging="deploy/hostinger-dev-andy-core-nav-v2"
          for file in admin/class-yby-andy-os-navigation.php admin/class-yby-project-studio.php inc/class-yby-core.php inc/class-yby-landing-page-cpt.php; do
            test -s "$staging/$file"
            php -l "$staging/$file"
          done
          test -s "$staging/assets/css/andy-core-native-l3-v2.css"
          node --check "$staging/assets/js/andy-core-native-l3-v2.js"
          cmp "$staging/admin/class-yby-andy-os-navigation.php" admin/class-yby-andy-os-navigation.php
          cmp "$staging/assets/css/andy-core-native-l3-v2.css" assets/css/andy-core-native-l3-v2.css
          cmp "$staging/assets/js/andy-core-native-l3-v2.js" assets/js/andy-core-native-l3-v2.js
          grep -F "YBY_Andy_OS_Navigation::root_capability()" "$staging/admin/class-yby-project-studio.php"
          grep -F "__( 'Andy Core', 'yby-core' )" "$staging/admin/class-yby-project-studio.php"
          grep -F "YBY_Andy_OS_Navigation(), 'enqueue_tertiary'" "$staging/inc/class-yby-core.php"
          grep -F "'show_in_menu' => 'yby-os'" "$staging/inc/class-yby-landing-page-cpt.php"
          echo "ANDY_CORE_V2_DEV_RC_SIX_FILES_LINT_AND_SOURCE_MATCH_PASS"

      - name: Build release candidate package
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ANDY_CORE_UPDATE_SIGNING_SECRET: ${{ secrets.ANDY_CORE_UPDATE_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          release_root="$GITHUB_WORKSPACE"
          RELEASE_SOURCE_DIR="$release_root" RELEASE_OUTPUT_DIR="$GITHUB_WORKSPACE/releases/v1.9.0" SOURCE_BRANCH="${SOURCE_BRANCH}" SOURCE_COMMIT="${SOURCE_COMMIT}" BUILD_CONTEXT=RELEASE_CANDIDATE bash scripts/build-v1.9.0-release.sh
          package="releases/v1.9.0/andy-core-v1.9.0.zip"
          checksum="releases/v1.9.0/SHA256.txt"
          metadata="releases/v1.9.0/update-metadata.json"
          test -s "$package"
          test -s "$checksum"
          test -s "$metadata"
          if [[ -n "${ANDY_CORE_UPDATE_SIGNING_SECRET:-}" ]]; then test -s releases/v1.9.0/update-metadata.sig; else test ! -e releases/v1.9.0/update-metadata.sig; fi
          test -s releases/v1.9.0/BUILD_INFO.md
          for doc in RELEASE_NOTES_v1.9.0.md UPGRADE_GUIDE_v1.9.0.md ROLLBACK_GUIDE_v1.9.0.md; do
            test -s "$doc"
            cp "$doc" releases/v1.9.0/
          done
          unzip -Z1 "$package" | awk -F/ 'NF && $1 != "yby-core" { exit 1 }'
          unzip -Z1 "$package" | grep -Fx 'yby-core/yby-core.php'
          ! unzip -Z1 "$package" | grep -E '(^|/)(\.git|\.github|tests|docs|releases|scripts|packages)(/|$)'
          unzip -p "$package" yby-core/yby-core.php | grep -F 'Version:           1.9.0'
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_CORE_VERSION', '1.9.0' );"
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_DATABASE_VERSION', '1.4.0' );"
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_RUNTIME_DATABASE_VERSION', '1.5.0' );"
          expected_sha="$(awk 'NF {print $1; exit}' "$checksum")"
          actual_sha="$(sha256sum "$package" | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"
          php -r '$m=json_decode(file_get_contents($argv[1]),true); if (!is_array($m) || ($m["schema_version"] ?? null)!==1 || ($m["version"] ?? "")!=="1.9.0" || ($m["database_version"] ?? "")!=="1.4.0" || ($m["runtime_database_version"] ?? "")!=="1.5.0" || ($m["package"] ?? "")!=="andy-core-v1.9.0.zip" || ($m["sha256"] ?? "")!==$argv[2]) exit(1);' "$metadata" "$actual_sha"
          git show v1.5.7:inc/class-yby-update-verifier.php > "$RUNNER_TEMP/v157-update-verifier.php"
          php tests/updater-backward-compat-harness.php "$RUNNER_TEMP/v157-update-verifier.php" "$package" "$metadata"
          grep -F 'Build Context: RELEASE_CANDIDATE' releases/v1.9.0/BUILD_INFO.md
          grep -F 'PHP Lint: PASS' releases/v1.9.0/BUILD_INFO.md
          grep -F 'git diff --check: PASS' releases/v1.9.0/BUILD_INFO.md
          if [[ -n "${ANDY_CORE_UPDATE_SIGNING_SECRET:-}" ]]; then grep -F 'Ed25519 Signature: PASS' releases/v1.9.0/BUILD_INFO.md; else grep -F 'Ed25519 Signature: NOT_SIGNED' releases/v1.9.0/BUILD_INFO.md; fi

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: andy-core-v1.9.0-release-candidate
          path: releases/v1.9.0
          if-no-files-found: error
