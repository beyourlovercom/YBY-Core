name: Release Package Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-24.04
    steps:
      # Pull requests validate GitHub's disposable base+head merge result.
      # Previously a head-only checkout lacked the current v2.2.6 builder.
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Verify exact merge-source provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = "$EVENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$EVENT_REF" = "refs/pull/${PR_NUMBER}/merge"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$checkout_sha"
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$checkout_sha"
            test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
            echo "PR_BASE_HEAD_MERGE_PROVENANCE_PASS base=$PR_BASE_SHA head=$PR_HEAD_SHA merge=$checkout_sha"
          else
            echo "NON_PR_SOURCE_PROVENANCE_PASS source=$checkout_sha"
          fi
          test -s scripts/build-v2.2.6-release.sh
          test -s scripts/build-v2.2.9-release.sh
          test -s scripts/build-v2.2.10-release.sh
          echo "CURRENT_RELEASE_BUILDER_PRESENT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20.19.1'

      - name: Release and updater assertions
        shell: bash
        run: |
          set -euo pipefail
          php tests/release-metadata-harness.php
          php tests/secure-updater-harness.php
          php tests/addon-registry-harness.php
          git diff --check
          for file in tests/*-harness.js; do node --check "$file"; done

      - name: Build release candidate package
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          ANDY_CORE_UPDATE_SIGNING_SECRET: ${{ secrets.ANDY_CORE_UPDATE_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          release_root="$GITHUB_WORKSPACE"
          RELEASE_SOURCE_DIR="$release_root" RELEASE_OUTPUT_DIR="$GITHUB_WORKSPACE/releases/v2.2.10" SOURCE_BRANCH="${SOURCE_BRANCH}" SOURCE_COMMIT="${SOURCE_COMMIT}" BUILD_CONTEXT=RELEASE_CANDIDATE bash scripts/build-v2.2.10-release.sh
          package="releases/v2.2.10/andy-core-v2.2.10.zip"
          checksum="releases/v2.2.10/SHA256.txt"
          metadata="releases/v2.2.10/update-metadata.json"
          test -s "$package"
          test -s "$checksum"
          test -s "$metadata"
          test -n "${ANDY_CORE_UPDATE_SIGNING_SECRET:-}" || { echo "Missing signed V2.2.10 candidate secret in GitHub Actions"; exit 1; }
          test -s releases/v2.2.10/update-metadata.sig
          test -s releases/v2.2.10/BUILD_INFO.md
          for doc in RELEASE_NOTES_v2.2.10.md UPGRADE_GUIDE_v2.2.10.md ROLLBACK_GUIDE_v2.2.10.md; do
            test -s "$doc"
            cp "$doc" releases/v2.2.10/
          done
          unzip -Z1 "$package" | awk -F/ 'NF && $1 != "yby-core" { exit 1 }'
          unzip -Z1 "$package" | grep -Fx 'yby-core/yby-core.php'
          ! unzip -Z1 "$package" | grep -E '(^|/)(\.git|\.github|tests|docs|releases|scripts|packages)(/|$)'
          unzip -p "$package" yby-core/yby-core.php | grep -F 'Version:           2.2.10'
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_CORE_VERSION', '2.2.10' );"
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_DATABASE_VERSION', '1.4.0' );"
          unzip -p "$package" yby-core/yby-core.php | grep -F "define( 'YBY_RUNTIME_DATABASE_VERSION', '1.5.0' );"
          expected_sha="$(awk 'NF {print $1; exit}' "$checksum")"
          actual_sha="$(sha256sum "$package" | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"
          php -r '$m=json_decode(file_get_contents($argv[1]),true); if (!is_array($m) || ($m["schema_version"] ?? null)!==1 || ($m["version"] ?? "")!=="2.2.10" || ($m["database_version"] ?? "")!=="1.4.0" || ($m["runtime_database_version"] ?? "")!=="1.5.0" || ($m["package"] ?? "")!=="andy-core-v2.2.10.zip" || ($m["sha256"] ?? "")!==$argv[2]) exit(1);' "$metadata" "$actual_sha"
          git show v1.5.7:inc/class-yby-update-verifier.php > "$RUNNER_TEMP/v157-update-verifier.php"
          php tests/updater-backward-compat-harness.php "$RUNNER_TEMP/v157-update-verifier.php" "$package" "$metadata"
          grep -F 'Build Context: RELEASE_CANDIDATE' releases/v2.2.10/BUILD_INFO.md
          grep -F 'PHP Lint: PASS' releases/v2.2.10/BUILD_INFO.md
          grep -F 'git diff --check: PASS' releases/v2.2.10/BUILD_INFO.md
          grep -F 'Ed25519 Signature: PASS' releases/v2.2.10/BUILD_INFO.md
          php -r '$m=file_get_contents($argv[1]); $s=base64_decode(trim(file_get_contents($argv[2])),true); $p=base64_decode("LcPq5x+fNa96aC+cXyC1ZbwRoGXCihF9YSG+iMHtjKU=",true); if (!is_string($m) || !is_string($s) || !is_string($p) || !sodium_crypto_sign_verify_detached($s,$m,$p)) {fwrite(STDERR,"Ed25519 verification FAIL\\n");exit(1);} echo "Ed25519 verification PASS\\n";' releases/v2.2.10/update-metadata.json releases/v2.2.10/update-metadata.sig

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: andy-core-v2.2.10-release-candidate
          path: releases/v2.2.10
          if-no-files-found: error
