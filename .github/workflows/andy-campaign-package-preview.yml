name: Andy Campaign package preview (NO DEPLOY)

on:
  pull_request:
    paths:
      - 'packages/andy-campaign/**'
      - 'packages/andy-campaign-packs/**'
      - '.github/workflows/andy-campaign-package-preview.yml'
  push:
    paths:
      - 'packages/andy-campaign/**'
      - 'packages/andy-campaign-packs/**'
      - '.github/workflows/andy-campaign-package-preview.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate - source syntax and contract
        run: |
          set -eu
          find packages/andy-campaign packages/andy-campaign-packs -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          php packages/andy-campaign/tests/lite-decision-harness.php
          php packages/andy-campaign/tests/core-navigation-harness.php
          php packages/andy-campaign-packs/black-friday-2026/tests/gift-pure-contract.php
      - name: Stage exactly two independent installable packages
        run: |
          set -eu
          mkdir -p dist/stage/andy-campaign/includes
          mkdir -p dist/stage/black-friday-2026/includes
          cp packages/andy-campaign/andy-campaign.php dist/stage/andy-campaign/
          cp packages/andy-campaign/includes/class-andy-campaign-lite.php dist/stage/andy-campaign/includes/
          cp packages/andy-campaign-packs/black-friday-2026/black-friday-2026.php dist/stage/black-friday-2026/
          cp packages/andy-campaign-packs/black-friday-2026/includes/class-byl-bf2026-gifts.php dist/stage/black-friday-2026/includes/
          cp packages/andy-campaign-packs/black-friday-2026/includes/class-byl-bf2026-r8-readiness.php dist/stage/black-friday-2026/includes/
          grep -q 'Plugin Name: Andy Campaign' dist/stage/andy-campaign/andy-campaign.php
          grep -q 'Plugin Name: BYL Black Friday' dist/stage/black-friday-2026/black-friday-2026.php
          cd dist/stage
          zip -q -r ../andy-campaign-0.1.0-preview.zip andy-campaign
          zip -q -r ../byl-black-friday-2026-0.1.0-preview.zip black-friday-2026
          cd ..
          python3 ../../scripts/check-campaign-r8-gift-bundle.py \
            byl-black-friday-2026-0.1.0-preview.zip \
            --source-root ../../packages/andy-campaign-packs/black-friday-2026
          python3 - byl-black-friday-2026-0.1.0-preview.zip <<'R8_NEG'
          import pathlib, sys, tempfile, subprocess, zipfile
          source=sys.argv[1]
          with zipfile.ZipFile(source) as z:
              src={name:z.read(name) for name in z.namelist()}
          safety='black-friday-2026/includes/class-byl-bf2026-r8-readiness.php'
          test_cases={
              'missing-review-class': {k:v for k,v in src.items() if k!=safety},
              'modified-review-class': {k:(v+b'\n/*stale R8 review*/\n') if k==safety else v for k,v in src.items()},
              'missing-bootstrap-require': {k:(v.replace(
                  b"require_once __DIR__ . '/includes/class-byl-bf2026-r8-readiness.php';",
                  b'/*missing reviewed readiness*/')) if k=='black-friday-2026/black-friday-2026.php'
                  else v for k,v in src.items()},
          }
          with tempfile.TemporaryDirectory() as dirname:
              for label, contents in test_cases.items():
                  target=pathlib.Path(dirname)/(label+'.zip')
                  with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as out:
                      for name,blob in contents.items():out.writestr(name,blob)
                  check=subprocess.run([sys.executable,
                      '../../scripts/check-campaign-r8-gift-bundle.py',str(target),
                      '--source-root','../../packages/andy-campaign-packs/black-friday-2026'],
                      capture_output=True,text=True)
                  if check.returncode==0:
                      raise SystemExit('R8_UNSAFE_PREVIEW_NOT_REJECTED:'+label)
                  print('R8_UNSAFE_PREVIEW_REJECTED='+label)
          print('R8_GIFT_PREVIEW_NEGATIVE_MATRIX_PASS=3')
          R8_NEG
          sha256sum *preview.zip > SHA256SUMS
          cat SHA256SUMS
          unzip -l andy-campaign-0.1.0-preview.zip
          unzip -l byl-black-friday-2026-0.1.0-preview.zip
      - name: Upload source-only preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: andy-campaign-c3c5-preview
          path: |
            dist/*preview.zip
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
