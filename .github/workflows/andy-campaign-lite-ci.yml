name: Andy Campaign Lite CI

on:
  pull_request:
    paths:
      - 'packages/andy-campaign/**'
      - 'packages/andy-campaign-packs/**'
      - 'admin/class-yby-andy-os-navigation.php'
      - 'docs/andy-campaign-v1/**'
      - '.github/workflows/andy-campaign-lite-ci.yml'
      - 'AGENTS.md'
  push:
    paths:
      - 'packages/andy-campaign/**'
      - 'packages/andy-campaign-packs/**'
      - 'admin/class-yby-andy-os-navigation.php'
      - 'docs/andy-campaign-v1/**'
      - '.github/workflows/andy-campaign-lite-ci.yml'
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find packages/andy-campaign -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l admin/class-yby-andy-os-navigation.php
          find packages/andy-campaign-packs -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Campaign runtime eligibility, collisions and legacy exclusion
        run: php packages/andy-campaign/tests/lite-decision-harness.php
      - name: Core menu/Content Landing Pages ownership
        run: php packages/andy-campaign/tests/core-navigation-harness.php
      - name: Black Friday pure gift contract
        run: php packages/andy-campaign-packs/black-friday-2026/tests/gift-pure-contract.php
      - name: R8 gift approval and fulfillment preflight
        run: |
          php -l packages/andy-campaign-packs/black-friday-2026/includes/class-byl-bf2026-r8-readiness.php
          php packages/andy-campaign-packs/black-friday-2026/tests/gift-readiness-preflight.php
      - name: R8 owner-selected free gift A signoff remains safe and OFF
        run: python3 packages/andy-campaign-packs/black-friday-2026/tests/r8-owner-gift-selection-contract.py
      - name: Draft gift Dev-only canonical redirect contract
        run: php packages/andy-campaign-packs/black-friday-2026/tests/draft-gift-redirect-contract.php
      - name: BF2026 landing and R9-B / R9-C OFF-only contracts
        run: |
          php packages/andy-campaign-packs/black-friday-2026/tests/landing-preview-contract.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r9-dev-display-map-contract.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r9-policy-pure-contract.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r9c-woo-adapter-fixture.php
      - name: BF2026 R10 source-only sale restoration, catalog and US gate
        run: |
          php packages/andy-campaign-packs/black-friday-2026/tests/r10-price-restore-fixture.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r10-catalog-fixture.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r10-country-gate-fixture.php
      - name: BF2026 R12 public route and automatic random-gift plan
        run: |
          php packages/andy-campaign-packs/black-friday-2026/tests/r12-auto-gift-planner-fixture.php
      - name: BF2026 R13 native cart, influencer coupons, audited FX and lifecycle
        run: |
          php packages/andy-campaign-packs/black-friday-2026/tests/r13-native-cart-writer-fixture.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r13-influencer-coupon-fixture.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r13-audited-fx-fixture.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r13-regional-price-write-gate.php
          php packages/andy-campaign-packs/black-friday-2026/tests/r13-campaign-window-fixture.php
      - name: Existing Andy Core navigation regression
        run: php tests/andy-os-unified-nav-v1-harness.php
