name: Andy Commerce M3 Disposable MySQL
on:
  pull_request:
    paths:
      - 'packages/andy-commerce/**'
      - '.github/workflows/marketing-m3-disposable-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-draft-crud:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: andy_m3_disposable_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --user=root --password=ci-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql
      - name: PHP syntax and unit checks
        run: |
          php -l packages/andy-commerce/includes/class-andy-commerce-marketing-draft-repository.php
          php -l packages/andy-commerce/includes/class-andy-commerce-m3-dev-bridge.php
          php packages/andy-commerce/tests/marketing-m3-transactional-repository-harness.php
          php packages/andy-commerce/tests/marketing-m3-request-security-harness.php
      - name: Real isolated MySQL create revise archive and audit
        env:
          ANDY_M3_DISPOSABLE_DB: 'YES'
          ANDY_M3_TEST_DB_HOST: 127.0.0.1
          ANDY_M3_TEST_DB_NAME: andy_m3_disposable_ci
          ANDY_M3_TEST_DB_USER: root
          ANDY_M3_TEST_DB_PASSWORD: ci-disposable-only
        run: php packages/andy-commerce/tests/marketing-m3-disposable-mysql-integration.php
