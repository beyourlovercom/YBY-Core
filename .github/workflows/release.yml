name: Build Tagged YBY Core Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tagged-release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: PHP syntax validation
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build and validate tagged release package
        shell: bash
        env:
          ANDY_CORE_UPDATE_SIGNING_SECRET: ${{ secrets.ANDY_CORE_UPDATE_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_dir="${GITHUB_WORKSPACE}/releases/v${version}"
          builder="scripts/build-v${version}-release.sh"
          package="${release_dir}/andy-core-v${version}.zip"
          test -f "${builder}"
          BUILD_CONTEXT=FINAL_RELEASE RELEASE_OUTPUT_DIR="${release_dir}" SOURCE_BRANCH="tag:${GITHUB_REF_NAME}" SOURCE_COMMIT="${GITHUB_SHA}" bash "${builder}"
          test -s "${package}"
          test -s "${release_dir}/SHA256.txt"
          test -s "${release_dir}/update-metadata.json"
          test -s "${release_dir}/update-metadata.sig"
          test -s "${release_dir}/BUILD_INFO.md"
          for doc in "RELEASE_NOTES_v${version}.md" "UPGRADE_GUIDE_v${version}.md" "ROLLBACK_GUIDE_v${version}.md"; do
            test -s "${doc}"
            cp "${doc}" "${release_dir}/"
          done
          unzip -Z1 "${package}" | awk -F/ 'NF && $1 != "yby-core" { exit 1 }'
          unzip -Z1 "${package}" | grep -Fx 'yby-core/yby-core.php'
          ! unzip -Z1 "${package}" | grep -E '(^|/)(\.git|\.github|tests|docs|releases|scripts)(/|$)'
          unzip -p "${package}" yby-core/yby-core.php | grep -F "Version:           ${version}"
          unzip -p "${package}" yby-core/yby-core.php | grep -F "define( 'YBY_CORE_VERSION', '${version}' );"
          unzip -p "${package}" yby-core/readme.txt | grep -F "Stable tag: ${version}"
          expected_sha="$(awk 'NF {print $1; exit}' "${release_dir}/SHA256.txt")"
          actual_sha="$(sha256sum "${package}" | awk '{print $1}')"
          test "${expected_sha}" = "${actual_sha}"
          php -r '$m=json_decode(file_get_contents($argv[1]),true); if (!is_array($m) || ($m["schema_version"] ?? null)!==1 || ($m["version"] ?? "")!==$argv[2] || ($m["database_version"] ?? "")!=="1.4.0" || ($m["package"] ?? "")!=="andy-core-v".$argv[2].".zip" || ($m["sha256"] ?? "")!==$argv[3]) exit(1);' "${release_dir}/update-metadata.json" "${version}" "${actual_sha}"
          grep -F 'Build Context: FINAL_RELEASE' "${release_dir}/BUILD_INFO.md"
          grep -F 'PHP Lint: PASS' "${release_dir}/BUILD_INFO.md"
          grep -F 'git diff --check: PASS' "${release_dir}/BUILD_INFO.md"
          grep -F 'Ed25519 Signature: PASS' "${release_dir}/BUILD_INFO.md"

      - name: Upload tagged build evidence
        uses: actions/upload-artifact@v4
        with:
          name: andy-core-${{ github.ref_name }}-tagged-build
          path: releases/${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
  publish-release:
    needs: tagged-release-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified tagged build
        uses: actions/download-artifact@v4
        with:
          name: andy-core-${{ github.ref_name }}-tagged-build
          path: releases/${{ github.ref_name }}

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          release_dir="${GITHUB_WORKSPACE}/releases/${tag}"
          notes="${release_dir}/RELEASE_NOTES_v${version}.md"
          repo="${GITHUB_REPOSITORY}"
          expected_sha="$(awk 'NF {print $1; exit}' "${release_dir}/SHA256.txt")"
          assets=(
            "${release_dir}/andy-core-v${version}.zip"
            "${release_dir}/SHA256.txt"
            "${release_dir}/update-metadata.json"
            "${release_dir}/update-metadata.sig"
            "${release_dir}/BUILD_INFO.md"
            "${release_dir}/RELEASE_NOTES_v${version}.md"
            "${release_dir}/UPGRADE_GUIDE_v${version}.md"
            "${release_dir}/ROLLBACK_GUIDE_v${version}.md"
          )
          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refusing to overwrite or mutate it."
            exit 1
          fi
          gh release create "${tag}" "${assets[@]}" --repo "${repo}" --title "Andy Core ${tag}" --notes-file "${notes}" --verify-tag --draft
          release_json="$(gh api "repos/${repo}/releases/tags/${tag}")"
          test "$(jq -r '.tag_name' <<<"${release_json}")" = "${tag}"
          test "$(jq -r '.draft' <<<"${release_json}")" = "true"
          test "$(jq -r '.prerelease' <<<"${release_json}")" = "false"
          mapfile -t actual_names < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
          expected_names=("BUILD_INFO.md" "RELEASE_NOTES_v${version}.md" "ROLLBACK_GUIDE_v${version}.md" "SHA256.txt" "UPGRADE_GUIDE_v${version}.md" "andy-core-v${version}.zip" "update-metadata.json" "update-metadata.sig")
          mapfile -t expected_names_sorted < <(printf '%s\n' "${expected_names[@]}" | sort)
          test "${actual_names[*]}" = "${expected_names_sorted[*]}"
          actual_digest="$(jq -r --arg n "andy-core-v${version}.zip" '.assets[] | select(.name==$n) | .digest' <<<"${release_json}")"
          test "${actual_digest}" = "sha256:${expected_sha}"
          gh release edit "${tag}" --repo "${repo}" --draft=false --prerelease=false --latest
